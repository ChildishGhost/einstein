name: Build

on: [push, pull_request, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # full history: docs:check compares RFCs with origin/dev (RFC-0001/R18)
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Change diff
        run: git --no-pager show -m "$GITHUB_SHA" --color

      - name: Tests and docs:check
        run: |
          npm test
          npm run docs:check

      - name: Build
        shell: bash
        run: |
          npm --version
          npm ci
          pushd plugins/desktop && npm ci; popd
          npm run lint
          npm run build

      - uses: denoland/setup-deno@v2
        with:
          deno-version-file: .tool-versions

      - name: gpui-native sources
        run: deno task native:fetch

      # docker is the runner's container engine (RFC-0008/R15)
      - name: gpui-native addon and packages
        run: CONTAINER_ENGINE=docker deno task native:build

      - name: Deno build and tests
        run: |
          deno task install:ui
          deno task build
          deno task test
